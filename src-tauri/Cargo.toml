[package]
name = "axis-sfx-lab"
version = "1.0.0"
description = "Axis SFX Lab - Procedural SFX Synthesizer and Seamless Loop Utility by Mahdi Kareem"
authors = ["Mahdi Kareem"]
edition = "2024"

[lib]
name = "axis_sfx_lab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
rand = "0.10"
base64 = "0.23"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
